name: Build & Deploy Icefall Map (daily)

on:
  # Läuft bei Push auf main und main-test (für Test-Branch Builds)
  push:
    branches:
      - main
      - main-test

  # Schedule läuft i.d.R. nur auf dem Default-Branch (main)
  #schedule:
   # - cron: "0 15 * * *"   # täglich 15:00 UTC (Kommentar ggf. anpassen)

  # Manuell triggerbar (auf beliebigem Branch)
  workflow_dispatch:
    inputs:
      uids:
        description: "Optionale UID-Liste (z.B. 12,34,56) fuer Plot-Build"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

# Wichtig: nicht main-test Builds mit main Deploys gegenseitig canceln
concurrency:
  group: "pages-${{ github.ref_name }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: System dependencies (spatial + netcdf)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libgdal-dev libproj-dev libgeos-dev libudunits2-dev \
            libnetcdf-dev netcdf-bin

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::httr
            any::httr2
            any::jsonlite
            any::dplyr
            any::lubridate
            any::tidyr
            any::readr
            any::tibble
            any::zoo
            any::ggplot2
            any::patchwork
            any::raster
            any::leaflet
            any::htmlwidgets
            any::htmltools
            any::ncdf4
            any::png
            any::readxl
          needs: check

      - name: Build plots (all UIDs)
        run: |
          if [ -n "${{ inputs.uids }}" ]; then
            Rscript scripts/00_build_plots_all.R --uids="${{ inputs.uids }}"
          else
            Rscript scripts/00_build_plots_all.R
          fi

      - name: Build list page (summary table)
        run: Rscript scripts/02_build_list_page.R

      - name: Add homepage (static)
        run: |
          mkdir -p site/assets
          cp static/index.html site/index.html

      - name: Build map (site/)
        run: Rscript scripts/01_build_map.R

      # ======= TEST-BRANCH: Artifact statt Deploy =======
      - name: Upload build artifact (site/) for test branches
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.ref_name }}
          path: site
          if-no-files-found: error
          retention-days: 7

      # ======= MAIN: GitHub Pages Deploy =======
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact (site/)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
