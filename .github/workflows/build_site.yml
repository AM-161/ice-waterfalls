name: Build & Deploy Icefall Map

on:
  push:
    branches:
      - main
      - main-test

  # Schedule runs only on the default branch. Keep it disabled unless needed.
  # schedule:
  #   - cron: "0 15 * * *"

  workflow_dispatch:
    inputs:
      uids:
        description: "Optional UID list for plot builds, e.g. 12,34,56"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref_name }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: System dependencies (spatial + netcdf)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libgdal-dev libproj-dev libgeos-dev libudunits2-dev \
            libnetcdf-dev netcdf-bin

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::httr
            any::httr2
            any::jsonlite
            any::dplyr
            any::lubridate
            any::stringr
            any::tidyr
            any::readr
            any::tibble
            any::zoo
            any::ggplot2
            any::raster
            any::leaflet
            any::htmlwidgets
            any::htmltools
            any::ncdf4
            any::png
            any::readxl
          needs: check

      - name: Build plots
        run: |
          if [ -n "${{ inputs.uids }}" ]; then
            Rscript scripts/00_build_plots_all.R --uids="${{ inputs.uids }}"
          else
            Rscript scripts/00_build_plots_all.R
          fi

      - name: Build list page
        run: Rscript scripts/02_build_list_page.R

      - name: Add homepage assets
        run: |
          mkdir -p site/assets
          cp assets/index.html site/index.html
          find assets -mindepth 1 -maxdepth 1 ! -name index.html -exec cp -R {} site/assets/ \;

      - name: Build map
        run: Rscript scripts/01_build_map.R

      - name: Upload build artifact for test branches
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.ref_name }}
          path: site
          if-no-files-found: error
          retention-days: 7

      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
